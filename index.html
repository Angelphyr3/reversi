<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- Security: only this site's own scripts, styles and images may load, and the page may not
       contact any server. See "Security" in PLAN.md. -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self'; base-uri 'none'; form-action 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="color-scheme" content="light dark">
  <meta name="description" content="Play Reversi in your browser — against a friend or the computer.">
  <title>Reversi</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <section class="panel" aria-label="Game info">
      <h1 class="title">
        <span class="title-discs" aria-hidden="true">
          <span class="disc-icon" data-color="black"></span><span class="disc-icon" data-color="white"></span>
        </span>
        Reversi
      </h1>

      <div class="corner-buttons">
        <button type="button" class="btn btn-quiet icon-btn" id="palette" aria-label="Color-blind friendly board" aria-pressed="false">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path class="wave" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z" />
            <circle cx="12" cy="12" r="3" />
          </svg>
        </button>
        <button type="button" class="btn btn-quiet icon-btn" id="mute" aria-label="Mute sounds" aria-pressed="false">
          <svg class="icon-sound-on" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h4l5-4v14l-5-4H4z" />
            <path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" />
          </svg>
          <svg class="icon-sound-off" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4 9h4l5-4v14l-5-4H4z" />
            <path class="wave" d="M16.5 9.5l5 5M21.5 9.5l-5 5" />
          </svg>
        </button>
      </div>

      <div class="scores">
        <div class="score" id="score-black">
          <span class="disc-icon" data-color="black" aria-hidden="true"></span>
          <span class="score-name" id="name-black">Player 1</span>
          <span class="score-count" id="count-black">2</span>
        </div>
        <div class="score" id="score-white">
          <span class="disc-icon" data-color="white" aria-hidden="true"></span>
          <span class="score-name" id="name-white">Player 2</span>
          <span class="score-count" id="count-white">2</span>
        </div>
      </div>

      <p class="turn" aria-live="polite">
        <span class="disc-icon" id="turn-disc" data-color="black" aria-hidden="true"></span>
        <span id="turn-text">Player 1's turn</span>
      </p>

      <button type="button" class="btn btn-quiet" id="new-game">New game</button>
    </section>

    <div class="board-frame">
      <div class="board" id="board" role="group" aria-label="Board — use arrow keys to move, Enter to place a disc"></div>

      <p class="toast" id="toast" role="status" hidden></p>

      <div class="banner" id="banner" hidden>
        <div class="banner-card" role="alertdialog" aria-labelledby="banner-title" aria-describedby="banner-score">
          <p class="banner-title" id="banner-title"></p>
          <p class="banner-score" id="banner-score"></p>
          <div class="actions">
            <button type="button" class="btn btn-quiet" id="change-game">Change game</button>
            <button type="button" class="btn" id="play-again">Play again</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- New-game setup: choose an opponent and difficulty. Covers the whole screen so it fits on
       the smallest phones. -->
  <div class="setup" id="setup" hidden>
    <div class="banner-card setup-card" role="dialog" aria-modal="true" aria-labelledby="setup-title">
      <p class="banner-title" id="setup-title">New game</p>

      <fieldset class="choice">
        <legend>Play against</legend>
        <label><input type="radio" name="mode" value="two"><span>A friend</span></label>
        <label><input type="radio" name="mode" value="computer"><span>The computer</span></label>
      </fieldset>

      <fieldset class="choice" id="level-choice">
        <legend>Difficulty</legend>
        <label><input type="radio" name="level" value="easy"><span>Easy</span></label>
        <label><input type="radio" name="level" value="medium"><span>Medium</span></label>
        <label><input type="radio" name="level" value="hard"><span>Hard</span></label>
        <label><input type="radio" name="level" value="expert"><span>Expert</span></label>
      </fieldset>

      <fieldset class="choice" id="hints-choice">
        <legend>Available moves</legend>
        <label><input type="radio" name="hints" value="show"><span>Show</span></label>
        <label><input type="radio" name="hints" value="hide"><span>Hide</span></label>
      </fieldset>

      <p class="setup-note" id="setup-note"></p>

      <div class="actions">
        <button type="button" class="btn btn-quiet" id="setup-cancel">Cancel</button>
        <button type="button" class="btn" id="setup-start">Start</button>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
  <script src="sound.js"></script>
  <script src="ai.js"></script>
  <script src="ui.js"></script>
</body>
</html>
